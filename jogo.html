<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E131A">
<title>Corrida da Capivara</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23F5C433'/><g fill='%231A1E24'><rect x='12' y='40' width='6' height='12' rx='2.5'/><rect x='22' y='41' width='5.5' height='11' rx='2.5'/><rect x='35.5' y='40' width='6' height='12' rx='2.5'/><circle cx='41.5' cy='18.8' r='2.7'/><path fill-rule='evenodd' d='M10 44C5.5 40 5.5 30 9.5 25.5C13.5 20 21 17 28.5 17.8C33 18.3 35.5 20 38 20L44 19.6C50.5 19.8 55.5 21 58.5 23.5C60.8 25.5 61 31 59.5 33.5C58.3 35.2 55.5 35.8 52.5 35.8L46 35.8C44.5 40.5 41 44.5 36 45.5L16 46.5C13.5 46.5 11.3 45.5 10 44ZM48.6 24.3a1.6 1.6 0 1 0-3.2 0a1.6 1.6 0 1 0 3.2 0ZM59.2 26.6a.8 1.1 0 1 0-1.6 0a.8 1.1 0 1 0 1.6 0Z'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --moldura:#0E131A; --moldura-2:#161C24; --texto:#E9EDF2; --apagado:#8E99A8; --linha:rgba(255,255,255,.10);
  --amarelo:#F5C433; --ambar:#F5A524;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--moldura); color:var(--texto); min-height:100vh;
  font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; align-items:center;
  padding:max(20px,env(safe-area-inset-top)) 16px 24px;
}
.topo{width:100%;max-width:960px;display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.logo{width:44px;height:44px;flex:none;border-radius:11px;background:var(--amarelo);display:grid;place-items:center;}
.logo svg{width:34px;height:34px;}
.topo h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1;}
.topo p{margin:2px 0 0;font-size:12.5px;color:var(--apagado);}
.topo .acoes{margin-left:auto;display:flex;gap:8px;}
.btn{
  background:var(--moldura-2);border:1px solid var(--linha);color:var(--texto);border-radius:8px;
  padding:7px 12px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--ambar);}
.estrada{width:100%;max-width:960px;height:2px;margin-bottom:18px;background:repeating-linear-gradient(90deg,var(--amarelo) 0 22px,transparent 22px 36px);opacity:.8;}
.palco{
  position:relative;width:100%;max-width:960px;border-radius:16px;overflow:hidden;
  border:1px solid var(--linha);box-shadow:0 18px 40px -24px rgba(0,0,0,.8);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;
}
canvas{display:block;width:100%;height:auto;}
.ajuda{width:100%;max-width:960px;display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12.5px;color:var(--apagado);}
.ajuda kbd{font:700 11px 'JetBrains Mono',monospace;background:var(--moldura-2);border:1px solid var(--linha);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--texto);}
.toque{display:none;width:100%;max-width:960px;gap:10px;margin-top:12px;}
.toque button{flex:1;padding:16px;font-size:15px;justify-content:center;}
@media (hover:none) and (pointer:coarse){ .toque{display:flex;} .ajuda .tecl{display:none;} }
@media (max-width:560px){ .topo h1{font-size:18px;} .topo p{display:none;} }
</style>
</head>
<body>

<header class="topo">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64"><g fill="#1A1E24"><rect x="12" y="40" width="6" height="12" rx="2.5"/><rect x="22" y="41" width="5.5" height="11" rx="2.5"/><rect x="35.5" y="40" width="6" height="12" rx="2.5"/><circle cx="41.5" cy="18.8" r="2.7"/><path fill-rule="evenodd" d="M10 44C5.5 40 5.5 30 9.5 25.5C13.5 20 21 17 28.5 17.8C33 18.3 35.5 20 38 20L44 19.6C50.5 19.8 55.5 21 58.5 23.5C60.8 25.5 61 31 59.5 33.5C58.3 35.2 55.5 35.8 52.5 35.8L46 35.8C44.5 40.5 41 44.5 36 45.5L16 46.5C13.5 46.5 11.3 45.5 10 44ZM48.6 24.3a1.6 1.6 0 1 0-3.2 0a1.6 1.6 0 1 0 3.2 0ZM59.2 26.6a.8 1.1 0 1 0-1.6 0a.8 1.1 0 1 0 1.6 0Z"/></g></svg></span>
  <div>
    <h1>Corrida da Capivara</h1>
    <p>Pule os cones e as barreiras da obra, abaixe dos urubus.</p>
  </div>
  <div class="acoes">
    <button class="btn" id="btnSom" type="button" title="Ligar/desligar o som">🔊</button>
    <a class="btn" href="inicio.html" title="Voltar à página inicial do Capivara">⌂ Início</a>
  </div>
</header>
<div class="estrada"></div>

<div class="palco" id="palco" aria-label="Área do jogo. Espaço ou toque para pular, seta para baixo para abaixar.">
  <canvas id="tela" width="960" height="300"></canvas>
</div>

<div class="toque">
  <button class="btn" id="btnAbaixar" type="button">▼ Abaixar</button>
  <button class="btn" id="btnPular" type="button">▲ Pular</button>
</div>

<div class="ajuda">
  <span class="tecl"><kbd>Espaço</kbd> / <kbd>↑</kbd> pular</span>
  <span class="tecl"><kbd>↓</kbd> abaixar</span>
  <span class="tecl"><kbd>P</kbd> pausar</span>
  <span>Toque na tela para pular · a velocidade aumenta com o tempo · o recorde fica salvo neste navegador</span>
</div>

<script>
(function(){
'use strict';

/* ---------- configuração ---------- */
var H = 300;                       // altura lógica do jogo
var W = largura();                 // largura lógica: menor no celular, para tudo aparecer maior
function largura(){ return window.innerWidth < 640 ? 600 : 960; }
var CHAO = 238;                    // linha do chão (y)
var GRAV = 2600;                   // px/s²
var PULO = 900;                    // velocidade inicial do pulo
var VEL_INI = 380, VEL_MAX = 1050; // px/s
var CHAVE_RECORDE = 'capivaraCorridaRecorde';
var estado = 'inicio';  // inicio | jogando | pausado | fim

var cv = document.getElementById('tela');
var ctx = cv.getContext('2d');
var palco = document.getElementById('palco');

function ajustarTela(){
  if(estado !== 'jogando') W = largura();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
ajustarTela();
window.addEventListener('resize', ajustarTela);

/* ---------- capivara (mesma silhueta da marca) ---------- */
var CORPO = new Path2D('M10 44C5.5 40 5.5 30 9.5 25.5C13.5 20 21 17 28.5 17.8C33 18.3 35.5 20 38 20L44 19.6C50.5 19.8 55.5 21 58.5 23.5C60.8 25.5 61 31 59.5 33.5C58.3 35.2 55.5 35.8 52.5 35.8L46 35.8C44.5 40.5 41 44.5 36 45.5L16 46.5C13.5 46.5 11.3 45.5 10 44Z');
var OLHO = [46.95, 24.3, 1.6];

/* ---------- estado ---------- */
var recorde = 0;
try { recorde = Number(localStorage.getItem(CHAVE_RECORDE)) || 0; } catch(e){}
var somLigado = true;
try { somLigado = localStorage.getItem('capivaraCorridaSom') !== '0'; } catch(e){}

var cap, obst, nuvens, morros, vel, dist, pontos, proxObst, tempoTotal, flash, ultimoMarco;

function novoJogo(){
  cap = { x: 70, y: CHAO, vy: 0, noChao: true, abaixado: false, passo: 0, piscar: 0 };
  obst = [];
  vel = VEL_INI; dist = 0; pontos = 0; proxObst = 500; tempoTotal = 0; flash = 0; ultimoMarco = 0;
  if(!nuvens){
    nuvens = []; for(var i=0;i<5;i++) nuvens.push({ x: Math.random()*W, y: 30+Math.random()*80, s: .6+Math.random()*.7 });
    morros = []; for(var j=0;j<6;j++) morros.push({ x: j*220, h: 30+Math.random()*45, w: 260+Math.random()*120 });
  }
}
novoJogo();

/* ---------- som (WebAudio, sem arquivos) ---------- */
var audio = null;
function bip(freq, dur, tipo, vol){
  if(!somLigado) return;
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .06, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}
var btnSom = document.getElementById('btnSom');
function atualizarBtnSom(){ btnSom.textContent = somLigado ? '🔊' : '🔇'; }
atualizarBtnSom();
btnSom.addEventListener('click', function(e){
  e.stopPropagation(); somLigado = !somLigado; atualizarBtnSom();
  try { localStorage.setItem('capivaraCorridaSom', somLigado ? '1' : '0'); } catch(err){}
});

/* ---------- controles ---------- */
function pular(){
  if(estado === 'inicio' || estado === 'fim'){ comecar(); return; }
  if(estado === 'pausado'){ estado = 'jogando'; return; }
  if(cap.noChao){
    cap.vy = -PULO; cap.noChao = false; cap.abaixado = false;
    bip(620, .09, 'square', .05);
  }
}
function abaixar(on){
  if(estado !== 'jogando') return;
  cap.abaixado = on;
  if(on && !cap.noChao) cap.vy = Math.max(cap.vy, 700); // desce mais rápido do pulo
}
function comecar(){ novoJogo(); estado = 'jogando'; ultimo = performance.now(); }
function pausar(){ if(estado === 'jogando') estado = 'pausado'; else if(estado === 'pausado') estado = 'jogando'; }

document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){ e.preventDefault(); if(!e.repeat) pular(); }
  else if(e.code === 'ArrowDown' || e.code === 'KeyS'){ e.preventDefault(); abaixar(true); }
  else if(e.code === 'KeyP' || e.code === 'Escape'){ pausar(); }
  else if(e.code === 'Enter' && estado !== 'jogando'){ comecar(); }
});
document.addEventListener('keyup', function(e){
  if(e.code === 'ArrowDown' || e.code === 'KeyS') abaixar(false);
});
palco.addEventListener('pointerdown', function(e){ e.preventDefault(); pular(); });
var bA = document.getElementById('btnAbaixar'), bP = document.getElementById('btnPular');
bP.addEventListener('pointerdown', function(e){ e.preventDefault(); pular(); });
bA.addEventListener('pointerdown', function(e){ e.preventDefault(); abaixar(true); });
['pointerup','pointercancel','pointerleave'].forEach(function(ev){ bA.addEventListener(ev, function(){ abaixar(false); }); });
document.addEventListener('visibilitychange', function(){ if(document.hidden && estado === 'jogando') estado = 'pausado'; });
window.addEventListener('blur', function(){ if(estado === 'jogando') estado = 'pausado'; });

/* ---------- obstáculos ---------- */
// cone: baixo e estreito · barreira: larga · pilha de cones · urubu: voa em alturas diferentes
function criarObstaculo(){
  var r = Math.random();
  var podeUrubu = pontos > 250;
  if(podeUrubu && r < .22){
    var alturas = [CHAO - 8, CHAO - 38, CHAO - 38, CHAO - 82]; // rente ao chão (pular), na altura da cabeça (abaixar ou pular), alto (passa por baixo)
    var y = alturas[Math.floor(Math.random()*alturas.length)];
    obst.push({ tipo:'urubu', x: W + 20, y: y, w: 46, h: 22, asa: 0 });
  } else if(r < .55){
    obst.push({ tipo:'cone', x: W + 20, y: CHAO, w: 24, h: 38 });
  } else if(r < .78){
    var n = pontos > 150 ? 2 + Math.floor(Math.random()*2) : 2;
    obst.push({ tipo:'cones', n: n, x: W + 20, y: CHAO, w: 24*n + 6*(n-1), h: 38 });
  } else {
    obst.push({ tipo:'barreira', x: W + 20, y: CHAO, w: 58, h: 46 });
  }
}

/* ---------- caixas de colisão (um pouco menores que o desenho, como no jogo original) ---------- */
function caixasCap(){
  var x = cap.x, y = cap.y;
  if(cap.abaixado && cap.noChao){
    return [{ x: x+6, y: y-26, w: 66, h: 22 }];
  }
  return [
    { x: x+8,  y: y-34, w: 40, h: 28 },   // corpo
    { x: x+40, y: y-46, w: 26, h: 18 },   // cabeça
    { x: x+12, y: y-10, w: 32, h: 10 }    // patas
  ];
}
function caixasObst(o){
  if(o.tipo === 'urubu') return [{ x: o.x+6, y: o.y-o.h+4, w: o.w-12, h: o.h-8 }];
  if(o.tipo === 'barreira') return [{ x: o.x+4, y: o.y-o.h+4, w: o.w-8, h: o.h-4 }];
  return [{ x: o.x+5, y: o.y-o.h+6, w: o.w-10, h: o.h-6 }];
}
function bate(a, b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* ---------- atualização ---------- */
function atualizar(dt){
  tempoTotal += dt;
  vel = Math.min(VEL_MAX, VEL_INI + tempoTotal * 14);
  dist += vel * dt;
  pontos = Math.floor(dist / 12);

  if(Math.floor(pontos/100) > ultimoMarco){
    ultimoMarco = Math.floor(pontos/100);
    flash = 1; bip(880, .08, 'square', .045); setTimeout(function(){ bip(1180, .1, 'square', .045); }, 90);
  }
  if(flash > 0) flash = Math.max(0, flash - dt*1.6);

  // capivara
  if(!cap.noChao){
    cap.vy += GRAV * dt * (cap.abaixado ? 1.6 : 1);
    cap.y += cap.vy * dt;
    if(cap.y >= CHAO){ cap.y = CHAO; cap.vy = 0; cap.noChao = true; }
  }
  cap.passo += dt * vel / 38;
  cap.piscar -= dt; if(cap.piscar < -3) cap.piscar = .12;

  // cenário (paralaxe)
  nuvens.forEach(function(n){ n.x -= vel*.08*n.s*dt; if(n.x < -120){ n.x = W + Math.random()*200; n.y = 30+Math.random()*80; } });
  morros.forEach(function(m){ m.x -= vel*.22*dt; if(m.x + m.w < 0){ m.x += 6*220; m.h = 30+Math.random()*45; } });

  // obstáculos
  // distância (px) até o próximo obstáculo: sempre maior que o alcance de um
  // pulo na velocidade atual, para nunca ficar impossível
  proxObst -= vel * dt;
  if(proxObst <= 0){
    criarObstaculo();
    proxObst = vel * 0.8 + 140 + Math.random() * vel * 0.9;
  }
  for(var i=obst.length-1;i>=0;i--){
    var o = obst[i];
    o.x -= (o.tipo === 'urubu' ? vel*1.08 : vel) * dt;
    if(o.tipo === 'urubu') o.asa += dt*10;
    if(o.x + o.w < -20) obst.splice(i,1);
  }

  // colisão
  var cc = caixasCap();
  for(var k=0;k<obst.length;k++){
    var co = caixasObst(obst[k]);
    for(var a=0;a<cc.length;a++) for(var b=0;b<co.length;b++){
      if(bate(cc[a], co[b])){ fimDeJogo(); return; }
    }
  }
}

function fimDeJogo(){
  estado = 'fim';
  bip(180, .25, 'sawtooth', .07); setTimeout(function(){ bip(110, .3, 'sawtooth', .07); }, 140);
  if(pontos > recorde){
    recorde = pontos; novoRecorde = true;
    try { localStorage.setItem(CHAVE_RECORDE, String(recorde)); } catch(e){}
  } else novoRecorde = false;
  if(navigator.vibrate) try{ navigator.vibrate(120); }catch(e){}
}
var novoRecorde = false;

/* ---------- desenho ---------- */
function ceu(){
  // o céu escurece aos poucos e volta: ciclo dia → entardecer → noite a cada ~700 pontos
  var t = (pontos % 1400) / 1400;
  var noite = Math.max(0, Math.sin(t * Math.PI * 2 - Math.PI/2) * .5 + .5); // 0 dia … 1 noite
  var g = ctx.createLinearGradient(0, 0, 0, CHAO);
  g.addColorStop(0, mistura('#7EC3E8', '#0B1220', noite));
  g.addColorStop(1, mistura('#F6E2B3', '#1B2433', noite));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, CHAO);
  // sol / lua
  ctx.globalAlpha = 1;
  ctx.fillStyle = mistura('#FFD66B', '#E9EDF2', noite);
  ctx.beginPath(); ctx.arc(W - 120, 64, 22, 0, Math.PI*2); ctx.fill();
  if(noite > .5){
    ctx.fillStyle = mistura('#7EC3E8', '#0B1220', noite);
    ctx.beginPath(); ctx.arc(W - 110, 58, 20, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(233,237,242,' + ((noite-.5)*1.6).toFixed(2) + ')';
    for(var i=0;i<26;i++){ var sx = (i*137 + 40) % W, sy = (i*53) % 140 + 10; ctx.fillRect(sx, sy, 2, 2); }
  }
  return noite;
}
function mistura(a, b, t){
  var pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  var r = Math.round(((pa>>16)&255)*(1-t) + ((pb>>16)&255)*t);
  var gg = Math.round(((pa>>8)&255)*(1-t) + ((pb>>8)&255)*t);
  var bb = Math.round((pa&255)*(1-t) + (pb&255)*t);
  return 'rgb(' + r + ',' + gg + ',' + bb + ')';
}

function desenharCenario(noite){
  // nuvens
  ctx.fillStyle = noite > .5 ? 'rgba(233,237,242,.10)' : 'rgba(255,255,255,.85)';
  nuvens.forEach(function(n){
    var s = n.s;
    [[0,0,34,12],[22,-8,22,14],[-20,-4,18,10]].forEach(function(e){
      ctx.beginPath(); ctx.ellipse(n.x+e[0]*s, n.y+e[1]*s, e[2]*s, e[3]*s, 0, 0, Math.PI*2); ctx.fill();
    });
  });
  // morros ao fundo
  ctx.fillStyle = mistura('#9DB58A', '#141C26', noite);
  morros.forEach(function(m){
    ctx.beginPath(); ctx.moveTo(m.x, CHAO-18);
    ctx.quadraticCurveTo(m.x + m.w/2, CHAO - 18 - m.h*2, m.x + m.w, CHAO-18);
    ctx.fill();
  });
  // acostamento (terra) e asfalto
  ctx.fillStyle = mistura('#C9A66B', '#2A2A26', noite);
  ctx.fillRect(0, CHAO-18, W, 18);
  ctx.fillStyle = mistura('#3A3F47', '#1A1E24', noite);
  ctx.fillRect(0, CHAO, W, H - CHAO);
  // meio-fio
  ctx.fillStyle = mistura('#D7D2C8', '#3A3F47', noite);
  ctx.fillRect(0, CHAO, W, 3);
  // faixa amarela tracejada (anda com a velocidade)
  ctx.fillStyle = '#F5C433';
  var off = dist % 70;
  for(var x = -off; x < W; x += 70) ctx.fillRect(x, CHAO + 34, 40, 5);
  // pedrinhas no asfalto
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  var off2 = dist % 53;
  for(var p = -off2; p < W; p += 53){ ctx.fillRect(p, CHAO + 14, 3, 2); ctx.fillRect(p + 27, CHAO + 52, 2, 2); }
}

function desenharCapivara(noite){
  var x = cap.x, y = cap.y;
  var esc = 1.35;                       // silhueta de 64×64 → ~86px
  var achatado = cap.abaixado && cap.noChao;
  ctx.save();
  ctx.translate(x - 6*esc, y - 52*esc * (achatado ? .62 : 1));
  ctx.scale(esc * (achatado ? 1.12 : 1), esc * (achatado ? .62 : 1));

  var corPelo = '#B5793A', corPata = '#8A5A28', corSombra = '#6E461F';
  // patas animadas (alternam ao correr; esticadas no ar)
  var fase = Math.sin(cap.passo * Math.PI);
  var pa = cap.noChao ? fase * 3 : 1.5, pb = cap.noChao ? -fase * 3 : -1.5;
  ctx.fillStyle = corPata;
  arred(12 + pa, 40, 6, 12 - Math.max(0, -pa), 2.5);
  arred(35.5 + pb, 40, 6, 12 - Math.max(0, -pb), 2.5);
  ctx.fillStyle = corSombra;
  arred(22 + pb*.6, 41, 5.5, 11, 2.5);

  ctx.fillStyle = corPelo; ctx.fill(CORPO);
  // barriga mais clara
  ctx.fillStyle = 'rgba(255,230,180,.18)';
  ctx.beginPath(); ctx.ellipse(28, 38, 14, 5, 0, 0, Math.PI*2); ctx.fill();
  // orelha
  ctx.fillStyle = corSombra; ctx.beginPath(); ctx.arc(41.5, 18.8, 2.7, 0, Math.PI*2); ctx.fill();
  // olho (pisca de vez em quando; X quando perde)
  ctx.fillStyle = '#1A1E24';
  if(estado === 'fim'){
    ctx.strokeStyle = '#1A1E24'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(45.4,22.8); ctx.lineTo(48.4,25.8); ctx.moveTo(48.4,22.8); ctx.lineTo(45.4,25.8); ctx.stroke();
  } else if(cap.piscar > 0){
    ctx.fillRect(45.4, 24, 3, .9);
  } else {
    ctx.beginPath(); ctx.arc(OLHO[0], OLHO[1], OLHO[2], 0, Math.PI*2); ctx.fill();
  }
  // focinho
  ctx.beginPath(); ctx.ellipse(58.4, 26.6, .8, 1.1, 0, 0, Math.PI*2); ctx.fill();
  // capacete de obra amarelo 👷
  ctx.fillStyle = '#F5C433';
  ctx.beginPath(); ctx.ellipse(44, 19, 7.5, 5, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(35.5, 18.4, 17, 1.8);
  ctx.restore();

  // sombra no chão
  var alt = Math.max(0, CHAO - cap.y);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.28 - Math.min(.2, alt/600)).toFixed(2) + ')';
  ctx.beginPath(); ctx.ellipse(x + 38, CHAO + 4, 34 - Math.min(16, alt/10), 4, 0, 0, Math.PI*2); ctx.fill();
}
function arred(x, y, w, h, r){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}

function desenharCone(x, y){
  ctx.fillStyle = '#E8661C';
  ctx.beginPath(); ctx.moveTo(x+12, y-38); ctx.lineTo(x+21, y-4); ctx.lineTo(x+3, y-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#F4F1EA';
  ctx.beginPath(); ctx.moveTo(x+8.8, y-26); ctx.lineTo(x+15.2, y-26); ctx.lineTo(x+16.6, y-20); ctx.lineTo(x+7.4, y-20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+6.2, y-15); ctx.lineTo(x+17.8, y-15); ctx.lineTo(x+19, y-10); ctx.lineTo(x+5, y-10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#C24F12'; ctx.fillRect(x, y-5, 24, 5);
}
function desenharBarreira(o){
  var x = o.x, y = o.y;
  ctx.fillStyle = '#4A4F57';
  ctx.fillRect(x+6, y-30, 5, 30); ctx.fillRect(x+o.w-11, y-30, 5, 30);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y-46, o.w, 16); ctx.clip();
  ctx.fillStyle = '#F4F1EA'; ctx.fillRect(x, y-46, o.w, 16);
  ctx.fillStyle = '#D03B3B';
  for(var i=-16;i<o.w+16;i+=16){ ctx.beginPath(); ctx.moveTo(x+i, y-30); ctx.lineTo(x+i+8, y-30); ctx.lineTo(x+i+16, y-46); ctx.lineTo(x+i+8, y-46); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#F5A524'; ctx.beginPath(); ctx.arc(x+8, y-49, 3, 0, Math.PI*2); ctx.fill();
}
function desenharUrubu(o, noite){
  var x = o.x, y = o.y - o.h/2, bat = Math.sin(o.asa);
  ctx.fillStyle = noite > .5 ? '#4A505A' : '#1A1E24';
  // asas
  ctx.beginPath(); ctx.moveTo(x+16, y); ctx.lineTo(x+30, y); ctx.lineTo(x+24, y - 16*bat); ctx.closePath(); ctx.fill();
  // corpo
  ctx.beginPath(); ctx.ellipse(x+24, y+2, 16, 6, 0, 0, Math.PI*2); ctx.fill();
  // cabeça
  ctx.fillStyle = '#9C4A44'; ctx.beginPath(); ctx.arc(x+6, y, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#E8D9B0'; ctx.beginPath(); ctx.moveTo(x+2, y-1); ctx.lineTo(x-4, y+1); ctx.lineTo(x+2, y+2); ctx.fill();
  // cauda
  ctx.fillStyle = noite > .5 ? '#4A505A' : '#1A1E24';
  ctx.beginPath(); ctx.moveTo(x+38, y); ctx.lineTo(x+48, y-3); ctx.lineTo(x+48, y+5); ctx.closePath(); ctx.fill();
}

function texto(t, x, y, tam, cor, alinh, peso){
  ctx.font = (peso || 700) + ' ' + tam + 'px "JetBrains Mono", monospace';
  ctx.textAlign = alinh || 'left'; ctx.fillStyle = cor; ctx.fillText(t, x, y);
}
function pad(n){ return String(n).padStart(5, '0'); }

function desenharHUD(noite){
  var cor = noite > .5 ? '#E9EDF2' : '#1B2129';
  var corApag = noite > .5 ? 'rgba(233,237,242,.6)' : 'rgba(27,33,41,.55)';
  var piscando = estado === 'jogando' && flash > 0 && Math.floor(flash*10) % 2 === 0;
  if(!piscando) texto(pad(pontos), W - 24, 36, 22, cor, 'right');
  texto('REC ' + pad(recorde), W - 24 - 104, 36, 22, corApag, 'right');
}

function painel(titulo, linhas){
  ctx.fillStyle = 'rgba(14,19,26,.72)';
  var w = Math.min(420, W - 40), h = 64 + linhas.length*26, x = (W - w)/2, y = 70;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x, y, w, h, 14); else ctx.rect(x, y, w, h); ctx.fill();
  texto(titulo, W/2, y + 42, 26, '#F5C433', 'center');
  linhas.forEach(function(l, i){
    ctx.font = '600 15px "IBM Plex Sans", sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = i === 0 ? '#E9EDF2' : '#B3BCC8'; ctx.fillText(l, W/2, y + 76 + i*26);
  });
}

function desenhar(){
  ctx.clearRect(0, 0, W, H);
  var noite = ceu();
  desenharCenario(noite);
  obst.forEach(function(o){
    if(o.tipo === 'cone') desenharCone(o.x, o.y);
    else if(o.tipo === 'cones'){ for(var i=0;i<o.n;i++) desenharCone(o.x + i*30, o.y); }
    else if(o.tipo === 'barreira') desenharBarreira(o);
    else desenharUrubu(o, noite);
  });
  desenharCapivara(noite);
  desenharHUD(noite);

  var toque = matchMedia('(hover:none) and (pointer:coarse)').matches;
  if(estado === 'inicio'){
    painel('CORRIDA DA CAPIVARA', [toque ? 'Toque na tela para começar' : 'Aperte Espaço para começar', 'Pule cones e barreiras · abaixe dos urubus']);
  } else if(estado === 'pausado'){
    painel('PAUSADO', [toque ? 'Toque para continuar' : 'Aperte Espaço ou P para continuar']);
  } else if(estado === 'fim'){
    painel('FIM DE JOGO', [
      (novoRecorde ? '🏆 Novo recorde: ' : 'Pontos: ') + pontos,
      'Recorde: ' + recorde,
      toque ? 'Toque para correr de novo' : 'Espaço ou Enter para correr de novo'
    ]);
  }
}

/* ---------- laço principal ---------- */
var ultimo = performance.now();
function quadro(agora){
  var dt = Math.min(0.033, (agora - ultimo) / 1000);
  ultimo = agora;
  if(estado === 'jogando') atualizar(dt);
  else if(estado === 'inicio'){ cap.passo += dt*4; nuvens.forEach(function(n){ n.x -= 6*n.s*dt; if(n.x < -120) n.x = W + 60; }); cap.piscar -= dt; if(cap.piscar < -3) cap.piscar = .12; }
  desenhar();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
})();
</script>
