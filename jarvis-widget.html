<!-- ============================================================
     JARVIS · widget para o Painel de Suprimentos
     Cole este bloco inteiro logo antes de </body>.
     Depois ajuste as 3 linhas marcadas com "AJUSTAR".
     ============================================================ -->

<style>
  :root {
    --j-bg: #1c1d20;
    --j-panel: #25262a;
    --j-line: #3a3b40;
    --j-text: #ecebe6;
    --j-dim: #9a9a94;
    --j-accent: #F5C433;
  }
  #jarvis-orb {
    position: fixed; right: 20px; bottom: 20px; z-index: 9998;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--j-bg); border: 2px solid var(--j-accent);
    color: var(--j-accent); cursor: pointer;
    display: grid; place-items: center;
    font: 600 22px/1 Oswald, Inter, system-ui, sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  #jarvis-orb::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--j-accent); opacity: 0; pointer-events: none;
  }
  #jarvis-orb[data-state="listening"]::after { animation: j-ring 1.4s ease-out infinite; }
  #jarvis-orb[data-state="thinking"] { border-style: dashed; animation: j-spin 2.4s linear infinite; }
  #jarvis-orb[data-state="speaking"]::after { animation: j-ring .8s ease-out infinite; }
  @keyframes j-ring { from { transform: scale(.8); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }
  @keyframes j-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #jarvis-orb::after, #jarvis-orb[data-state] { animation: none !important; }
    #jarvis-orb[data-state="listening"]::after,
    #jarvis-orb[data-state="speaking"]::after { opacity: .7; }
  }

  #jarvis-panel {
    position: fixed; right: 20px; bottom: 90px; z-index: 9999;
    width: min(380px, calc(100vw - 24px)); height: min(520px, 70vh);
    background: var(--j-bg); color: var(--j-text);
    border: 1px solid var(--j-line); border-radius: 14px;
    display: none; flex-direction: column; overflow: hidden;
    font: 400 14px/1.45 Inter, system-ui, sans-serif;
    box-shadow: 0 16px 40px rgba(0,0,0,.55);
  }
  #jarvis-panel.open { display: flex; }
  #jarvis-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--j-line);
  }
  #jarvis-head strong { font: 600 17px Oswald, Inter, sans-serif; letter-spacing: .02em; flex: 1; }
  #jarvis-head label { display: flex; align-items: center; gap: 6px; color: var(--j-dim); font-size: 12px; cursor: pointer; }
  #jarvis-head input { accent-color: var(--j-accent); }
  #jarvis-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .j-msg { max-width: 88%; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .j-msg.user { align-self: flex-end; background: var(--j-accent); color: #1c1d20; border-bottom-right-radius: 3px; }
  .j-msg.bot { align-self: flex-start; background: var(--j-panel); border: 1px solid var(--j-line); border-bottom-left-radius: 3px; }
  .j-msg.err { align-self: flex-start; color: #ff8a80; border: 1px solid #6b2f2b; background: transparent; }
  .j-empty { color: var(--j-dim); margin: auto; text-align: center; padding: 0 16px; }
  #jarvis-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--j-line); }
  #jarvis-input {
    flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px;
    background: var(--j-panel); border: 1px solid var(--j-line); color: var(--j-text);
    font: inherit;
  }
  #jarvis-input:focus, #jarvis-orb:focus-visible, .j-btn:focus-visible { outline: 2px solid var(--j-accent); outline-offset: 2px; }
  .j-btn {
    width: 40px; border-radius: 8px; border: 1px solid var(--j-line);
    background: var(--j-panel); color: var(--j-text); cursor: pointer; font-size: 16px;
  }
  .j-btn.on { background: var(--j-accent); color: #1c1d20; border-color: var(--j-accent); }
  @media (max-width: 480px) {
    #jarvis-panel { right: 12px; bottom: 84px; }
    #jarvis-orb { right: 12px; bottom: 12px; }
  }
</style>

<button id="jarvis-orb" type="button" aria-label="Abrir o Jarvis" data-state="idle">J</button>

<section id="jarvis-panel" aria-label="Jarvis, assistente do painel">
  <div id="jarvis-head">
    <strong>Jarvis</strong>
    <label title="Fica ouvindo e responde quando você disser 'Jarvis'">
      <input type="checkbox" id="jarvis-wake"> Chamar por voz
    </label>
    <label><input type="checkbox" id="jarvis-voice" checked> Voz</label>
  </div>
  <div id="jarvis-log" aria-live="polite">
    <div class="j-empty">Pergunte sobre os pedidos de CAP, entregas, devoluções e créditos entre obras.</div>
  </div>
  <form id="jarvis-form" autocomplete="off">
    <input id="jarvis-input" type="text" placeholder="Digite ou toque no microfone" aria-label="Mensagem para o Jarvis">
    <button type="button" class="j-btn" id="jarvis-mic" aria-label="Falar">🎤</button>
    <button type="submit" class="j-btn" aria-label="Enviar">➤</button>
  </form>
</section>

<script>
/* ---------- AJUSTAR (1/2): URL da função e chave pública ---------- */
window.JARVIS_CONFIG = {
  url: "https://SEU-PROJETO.supabase.co/functions/v1/jarvis",
  anonKey: "SUA_CHAVE_ANON_PUBLICA",
  /* ---------- AJUSTAR (2/2): como pegar o token do usuário logado ----------
     Troque "sb" pelo nome do seu cliente Supabase no painel
     (o que aparece em createClient(...)). */
  getToken: async () => {
    const { data } = await sb.auth.getSession();
    return data?.session?.access_token || null;
  },
};

(() => {
  const cfg = window.JARVIS_CONFIG;
  const $ = (id) => document.getElementById(id);
  const orb = $("jarvis-orb"), panel = $("jarvis-panel"), log = $("jarvis-log");
  const input = $("jarvis-input"), form = $("jarvis-form"), micBtn = $("jarvis-mic");
  const wakeChk = $("jarvis-wake"), voiceChk = $("jarvis-voice");

  const history = [];
  let busy = false, speaking = false, listening = false;

  const setState = (s) => (orb.dataset.state = s);

  function addMsg(text, cls) {
    log.querySelector(".j-empty")?.remove();
    const el = document.createElement("div");
    el.className = "j-msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  /* ---------- Voz de saída ---------- */
  function falar(texto) {
    if (!voiceChk.checked || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto.replace(/[*_#`]/g, ""));
    u.lang = "pt-BR";
    const v = speechSynthesis.getVoices().find((x) => x.lang === "pt-BR");
    if (v) u.voice = v;
    u.onstart = () => { speaking = true; setState("speaking"); pausarEscuta(); };
    u.onend = u.onerror = () => { speaking = false; setState("idle"); retomarEscuta(); };
    speechSynthesis.speak(u);
  }

  /* ---------- Envio ---------- */
  async function enviar(texto) {
    texto = texto.trim();
    if (!texto || busy) return;
    busy = true;
    addMsg(texto, "user");
    history.push({ role: "user", content: texto });
    setState("thinking");
    try {
      const token = await cfg.getToken();
      if (!token) throw new Error("Faça login no painel para usar o Jarvis.");
      const r = await fetch(cfg.url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token,
          apikey: cfg.anonKey,
        },
        body: JSON.stringify({ messages: history }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Erro ao falar com o Jarvis.");
      history.push({ role: "assistant", content: d.reply });
      addMsg(d.reply, "bot");
      setState("idle");
      falar(d.reply);
    } catch (e) {
      history.pop();
      addMsg(e.message, "err");
      setState("idle");
    } finally {
      busy = false;
    }
  }

  /* ---------- Voz de entrada ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, modo = "off"; // off | ptt | wake

  function criarRec() {
    if (!SR) return null;
    const r = new SR();
    r.lang = "pt-BR";
    r.interimResults = false;
    r.onstart = () => { listening = true; if (!busy && !speaking) setState("listening"); };
    r.onend = () => {
      listening = false;
      if (!busy && !speaking) setState("idle");
      if (modo === "wake" && !speaking) setTimeout(() => iniciar("wake"), 300);
      else micBtn.classList.remove("on");
    };
    r.onerror = (e) => {
      if (e.error === "not-allowed") {
        modo = "off"; wakeChk.checked = false;
        addMsg("Permita o uso do microfone no navegador.", "err");
      }
    };
    r.onresult = (ev) => {
      const t = ev.results[ev.results.length - 1][0].transcript.trim();
      if (modo === "wake") {
        const m = t.match(/\bjarvis\b[\s,.:!?-]*(.*)$/i);
        if (m && m[1].length > 1) { abrir(); enviar(m[1]); }
      } else {
        modo = "off";
        enviar(t);
      }
    };
    return r;
  }

  function iniciar(m) {
    if (!SR) { addMsg("Este navegador não suporta reconhecimento de voz. Use o Chrome ou o Edge.", "err"); return; }
    if (listening) return;
    modo = m;
    rec = rec || criarRec();
    speechSynthesis.cancel();
    try { rec.continuous = m === "wake"; rec.start(); } catch (_) {}
  }
  function pausarEscuta() { if (listening && rec) { try { rec.stop(); } catch (_) {} } }
  function retomarEscuta() { if (modo === "wake") setTimeout(() => iniciar("wake"), 300); }

  micBtn.addEventListener("click", () => {
    if (listening) { modo = "off"; rec.stop(); return; }
    micBtn.classList.add("on");
    iniciar("ptt");
  });
  wakeChk.addEventListener("change", () => {
    if (wakeChk.checked) iniciar("wake");
    else { modo = "off"; if (rec && listening) rec.stop(); }
  });

  /* ---------- Painel ---------- */
  function abrir() { panel.classList.add("open"); }
  orb.addEventListener("click", () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) input.focus();
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = input.value;
    input.value = "";
    enviar(t);
  });
})();
</script>
